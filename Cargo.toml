[workspace]
members = [
  "crates/rescue_core",
  "crates/rescue_analyzer",
  "crates/rescue_catalog",
  "crates/rescue_resolution",
  "crates/rescue_packaging",
  "crates/rescue_execution",
  "crates/rescue_rewriter",
  "crates/rescue_validation",
  "crates/rescue_manifest",
  "crates/rescue_promotion",
  "crates/rescue_pipeline",
  "cli/rescue-cli",
]
resolver = "2"

[workspace.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
