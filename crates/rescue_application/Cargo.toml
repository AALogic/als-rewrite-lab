[package]
name = "rescue_application"
version = "0.1.0"
edition = "2021"

[features]
default = []
compatibility-lab = []

[dependencies]
rescue_analyzer = { path = "../rescue_analyzer" }
rescue_catalog = { path = "../rescue_catalog" }
rescue_core = { path = "../rescue_core" }
rescue_pipeline = { path = "../rescue_pipeline" }
serde = { version = "1", features = ["derive"] }
sha2.workspace = true

[dev-dependencies]
flate2 = "1"
serde_json = "1"
sha2.workspace = true
tempfile = "3"
